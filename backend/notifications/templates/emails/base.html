<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <style>
            body { font-family: Arial, sans-serif; color: #333; background: #f9f9f9; padding: 20px; }
            .email-container { background: #fff; padding: 20px; border-radius: 8px; }
            .footer { font-size: 12px; color: #888; margin-top: 30px; }
        </style>
    </head>
    
    <body>
        <div class="email-container">
            {% block content %}{% endblock %}
            <div class="footer">
                Need help? Contact us at <a href="mailto:{{ support_email }}">{{ support_email }}</a>.
            </div>
        </div>
    </body>
</html>
