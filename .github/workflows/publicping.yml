name: Scheduled Public Ping
# This workflow is triggered at a scheduled interval of every 15 minutes
on:
  schedule:
    # * is a special character in YAML so you have to quote this string.
    # /15 denotes that it will run once every 15 minutes
    - cron:  '*/5 * * * *'

jobs:
  pinger_job:
    name: A job to ping and keep backend running
    runs-on: ubuntu-latest
    env:
      URL: ${{ secrets.LOGIN_PING }}
      METHOD: GET  # the method used to make the request. It is GET by default
    steps:
      - id: ping
        uses: sisodiya2421/pinger@master